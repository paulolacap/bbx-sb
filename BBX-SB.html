<!DOCTYPE html>
<html>
<head>
  <title>Beyblade Battle Score</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: white;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
    }

    .blue-side {
      flex: 1;
      background: #2196F3;
    }

    .red-side {
      flex: 1;
      background: #f44336;
    }

    .scoreboard {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .side {
      width: 20%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .middle {
      width: 60%;
      text-align: center;
      color: black;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .btn {
      background: #555;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 120px;
    }

    .btn:hover {
      background: #333;
    }

    .score {
      font-size: 150px;
      color: white;
      margin: 20px 0;
    }

    .blader1-score {
      color: white;
    }

    .blader2-score {
      color: white;
    }

    .log {
      width: 90%;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(255,255,255,0.9);
      border: 2px solid black;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      text-align: left;
      display: none; /* Hidden by default */
    }

  </style>
</head>
<body>

<!-- Background: Half blue, half red -->
<div class="background">
  <div class="blue-side"></div>
  <div class="red-side"></div>
</div>

<div class="scoreboard">

  <!-- Left buttons (Blader 1) -->
  <div class="side">
    <button class="btn" onclick="addPoints(1, 1, 'Spin Finish')">SPIN</button>
    <button class="btn" onclick="addPoints(1, 2, 'Over Finish')">OVER</button>
    <button class="btn" onclick="addPoints(1, 2, 'Burst Finish')">BURST</button>
    <button class="btn" onclick="addPoints(1, 3, 'Xtreme Finish')">XTREME</button>
  </div>

  <!-- Scores + Log + Controls -->
  <div class="middle">
    <div class="score">
      <span id="score1" class="blader1-score">0</span>
      <span style="margin: 0 50px;">-</span>
      <span id="score2" class="blader2-score">0</span>
    </div>
    <button class="btn" onclick="resetScores()">RESET</button>
    <button class="btn" onclick="undoLast()">UNDO</button>
    <button id="logButton" class="btn" onclick="toggleLog()" style="display: none;">LOGS</button>

    <div class="log" id="logBox"></div>
  </div>

  <!-- Right buttons (Blader 2) -->
  <div class="side">
    <button class="btn" onclick="addPoints(2, 1, 'Spin Finish')">SPIN</button>
    <button class="btn" onclick="addPoints(2, 2, 'Over Finish')">OVER</button>
    <button class="btn" onclick="addPoints(2, 2, 'Burst Finish')">BURST</button>
    <button class="btn" onclick="addPoints(2, 3, 'Xtreme Finish')">XTREME</button>
  </div>

</div>

<script>
  let score1 = 0;
  let score2 = 0;
  let round = 0;
  let log = [];
  let logVisible = false;

  function addPoints(blader, points, finishType) {
    if (blader === 1) {
      score1 += points;
      document.getElementById('score1').innerText = score1;
    } else {
      score2 += points;
      document.getElementById('score2').innerText = score2;
    }

    round++;
    let color = blader === 1 ? '#2196F3' : '#f44336';
    let entry = `<span style="color:${color}">Round ${round}: Blader ${blader} wins by ${finishType}</span>`;
    log.push({ blader, points, finishType, entry });
    updateLog();
  }

  function updateLog() {
    let logBox = document.getElementById('logBox');
    let logButton = document.getElementById('logButton');
    
    if (log.length === 0) {
      logBox.style.display = "none";
      logButton.style.display = "none";
    } else {
      logButton.style.display = "inline-block";
      logBox.innerHTML = log.map(item => item.entry).join('<br>');
      logBox.style.display = logVisible ? "block" : "none";
      logBox.scrollTop = logBox.scrollHeight;
    }
  }

  function resetScores() {
    score1 = 0;
    score2 = 0;
    round = 0;
    log = [];
    logVisible = false;
    document.getElementById('score1').innerText = score1;
    document.getElementById('score2').innerText = score2;
    updateLog();
  }

  function undoLast() {
    let last = log.pop();
    if (last) {
      if (last.blader === 1) {
        score1 -= last.points;
        if (score1 < 0) score1 = 0;
        document.getElementById('score1').innerText = score1;
      } else {
        score2 -= last.points;
        if (score2 < 0) score2 = 0;
        document.getElementById('score2').innerText = score2;
      }
      round--;
      updateLog();
    }
  }

  function toggleLog() {
    logVisible = !logVisible;
    updateLog();
  }
</script>

</body>
</html>
