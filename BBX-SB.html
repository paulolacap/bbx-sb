<!DOCTYPE html>
<html>
<head>
  <title>Beyblade Battle Score</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: white;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
    }

    .blue-side {
      flex: 1;
      background: #2196F3;
    }

    .red-side {
      flex: 1;
      background: #f44336;
    }

    .scoreboard {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .side {
      width: 20%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .middle {
      width: 60%;
      text-align: center;
      color: black;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      flex-wrap: wrap;
    }

    .btn {
      background: #555;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 120px;
    }

    .btn:hover {
      background: #333;
    }

    .score {
      font-size: 150px;
      color: white;
      margin: 20px 0;
    }

    .round {
      font-size: 36px;
      font-weight: bold;
      color: white;
      margin-bottom: 20px;
    }

    .blader1-score {
      color: white;
    }

    .blader2-score {
      color: white;
    }

    /* Log Overlay Styles */
    .log-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      overflow-y: auto;
    }

    .log-content {
      background: linear-gradient(45deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.7));
      padding: 20px;
      border-radius: 10px;
      max-height: 80%;
      overflow-y: auto;
    }

    .log-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    /* Proper Portrait Mode Layout */
    @media (max-width: 768px) {
      .scoreboard {
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
      }

      .round {
        margin-top: 20px;
        font-size: 30px;
      }

      .score {
        font-size: 100px;
      }

      .side {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        margin: 10px 0;
      }

      .middle {
        width: 100%;
        text-align: center;
      }

      .btn {
        width: 40%;
        font-size: 16px;
        margin: 5px 2px;
      }

      /* Keep reset/undo/logs buttons full width */
      .middle > div {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
      }

      .middle > div .btn {
        width: 30%;
        margin: 5px;
      }
    }

  </style>
</head>
<body>

<!-- Background -->
<div class="background">
  <div class="blue-side"></div>
  <div class="red-side"></div>
</div>

<div class="scoreboard">

  <!-- Left buttons -->
  <div class="side">
    <button class="btn" onclick="addPoints(1, 1, 'Spin Finish')">SPIN</button>
    <button class="btn" onclick="addPoints(1, 2, 'Over Finish')">OVER</button>
    <button class="btn" onclick="addPoints(1, 2, 'Burst Finish')">BURST</button>
    <button class="btn" onclick="addPoints(1, 3, 'Xtreme Finish')">XTREME</button>
  </div>

  <!-- Middle -->
  <div class="middle">
    <div class="round" id="round">Round 0</div>
    <div class="score">
      <span id="score1" class="blader1-score">0</span> - <span id="score2" class="blader2-score">0</span>
    </div>

    <div>
      <button class="btn" onclick="resetScores()">RESET</button>
      <button class="btn" onclick="undoLast()">UNDO</button>
      <button class="btn" onclick="toggleLog()">LOGS</button>
    </div>
  </div>

  <!-- Right buttons -->
  <div class="side">
    <button class="btn" onclick="addPoints(2, 1, 'Spin Finish')">SPIN</button>
    <button class="btn" onclick="addPoints(2, 2, 'Over Finish')">OVER</button>
    <button class="btn" onclick="addPoints(2, 2, 'Burst Finish')">BURST</button>
    <button class="btn" onclick="addPoints(2, 3, 'Xtreme Finish')">XTREME</button>
  </div>

</div>

<!-- Log Overlay -->
<div id="logOverlay" class="log-overlay">
  <div class="log-content">
    <h3>Game Log</h3>
    <div id="logBox"></div>
    <div class="log-buttons">
      <button class="btn" onclick="undoFromLog()">UNDO</button>
      <button class="btn" onclick="closeLog()">Close</button>
    </div>
  </div>
</div>

<script>
  let score1 = 0;
  let score2 = 0;
  let round = 0;
  let log = [];

  function addPoints(blader, points, finishType) {
    if (blader === 1) {
      score1 += points;
      document.getElementById('score1').innerText = score1;
    } else {
      score2 += points;
      document.getElementById('score2').innerText = score2;
    }

    round++;
    document.getElementById('round').innerText = `Round ${round}`;

    let color = blader === 1 ? '#2196F3' : '#f44336';
    let entry = `<span style="color:${color}">Round ${round}: Blader ${blader} wins by ${finishType}</span>`;
    log.push({ blader, points, finishType, entry });
    updateLog();
  }

  function updateLog() {
    let logBox = document.getElementById('logBox');
    logBox.innerHTML = log.map(item => item.entry).join('<br>');
  }

  function resetScores() {
    score1 = 0;
    score2 = 0;
    round = 0;
    log = [];
    document.getElementById('score1').innerText = score1;
    document.getElementById('score2').innerText = score2;
    document.getElementById('round').innerText = `Round ${round}`;
    updateLog();
  }

  function undoLast() {
    let last = log.pop();
    if (last) {
      if (last.blader === 1) {
        score1 -= last.points;
        if (score1 < 0) score1 = 0;
        document.getElementById('score1').innerText = score1;
      } else {
        score2 -= last.points;
        if (score2 < 0) score2 = 0;
        document.getElementById('score2').innerText = score2;
      }
      round--;
      document.getElementById('round').innerText = `Round ${round}`;
      updateLog();
    }
  }

  function toggleLog() {
    let logOverlay = document.getElementById('logOverlay');
    logOverlay.style.display = logOverlay.style.display === 'none' || logOverlay.style.display === '' ? 'block' : 'none';
    updateLog();
  }

  function closeLog() {
    let logOverlay = document.getElementById('logOverlay');
    logOverlay.style.display = 'none';
  }

  function undoFromLog() {
    let lastLog = log.pop();
    if (lastLog) {
      if (lastLog.blader === 1) {
        score1 -= lastLog.points;
        if (score1 < 0) score1 = 0;
        document.getElementById('score1').innerText = score1;
      } else {
        score2 -= lastLog.points;
        if (score2 < 0) score2 = 0;
        document.getElementById('score2').innerText = score2;
      }
      round--;
      document.getElementById('round').innerText = `Round ${round}`;
      updateLog();
    }
  }
</script>

</body>
</html>
